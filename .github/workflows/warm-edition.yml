# Pre-generates each hour's readings so no visitor waits for them.
#
# This one schedule also covers the daily passage. The passage's key is
# computed from Intl inside the function, not from the time this runs, so a
# fixed UTC cron cannot drift away from a 6am-Eastern boundary that moves with
# DST -- whichever UTC hour contains 6am ET that week, that run generates the
# day. The other 23 runs hit a warm CDN entry and cost nothing.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan only
# permits daily cron jobs -- an hourly schedule is rejected at deploy time with
# "Hobby accounts are limited to daily cron jobs". GitHub's scheduler has no
# such restriction and costs nothing.
#
# Requires a CRON_SECRET repository secret matching the CRON_SECRET environment
# variable set on the Vercel project.
name: Warm the shared edition

on:
  schedule:
    # A couple of minutes past the hour, so the edition has definitely rolled
    # over. Times are UTC, which is what the app keys its hour on.
    - cron: '2 * * * *'
  workflow_dispatch:

concurrency:
  group: warm-edition
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the hour's readings and the day's passage
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # A cold generation can take most of a minute per slot, and the
          # endpoint warms all three, so allow generous time.
          response=$(curl -fsS --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://bible-terminal.vercel.app/api/warm)
          echo "$response"
          # Fail loudly if a slot came back without an interpretation, so a
          # silent regression in the shared edition is visible in the run log.
          echo "$response" | jq -e '[.warmed[] | select(.interpreted)] | length > 0' >/dev/null || {
            echo "::error::No slot reported a completed interpretation"
            exit 1
          }
          # The passage is checked on its own because it is the one the
          # WhatsApp bot reads at 6:10 ET. A silent failure here is not a
          # missing hour on the site, it is a missing morning in the group.
          echo "$response" | jq -e '.warmed[] | select(.slot == "passage") | .interpreted' >/dev/null || {
            echo "::error::The daily passage has no interpretation"
            exit 1
          }
          # Not fatal: the reading still stands without it, the group just
          # loses its discussion message.
          echo "$response" | jq -e '.warmed[] | select(.slot == "passage") | .question' >/dev/null || {
            echo "::warning::The daily passage produced no discussion question"
          }

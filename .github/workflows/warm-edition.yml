# Pre-generates each hour's readings so no visitor waits for them.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan only
# permits daily cron jobs -- an hourly schedule is rejected at deploy time with
# "Hobby accounts are limited to daily cron jobs". GitHub's scheduler has no
# such restriction and costs nothing.
#
# Requires a CRON_SECRET repository secret matching the CRON_SECRET environment
# variable set on the Vercel project.
name: Warm hourly edition

on:
  schedule:
    # A couple of minutes past the hour, so the edition has definitely rolled
    # over. Times are UTC, which is what the app keys its hour on.
    - cron: '2 * * * *'
  workflow_dispatch:

concurrency:
  group: warm-edition
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm the hour's three slots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # A cold generation can take most of a minute per slot, and the
          # endpoint warms all three, so allow generous time.
          response=$(curl -fsS --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://bible-terminal.vercel.app/api/warm)
          echo "$response"
          # Fail loudly if a slot came back without an interpretation, so a
          # silent regression in the shared edition is visible in the run log.
          echo "$response" | grep -q '"interpreted": true' || {
            echo "::error::No slot reported a completed interpretation"
            exit 1
          }
